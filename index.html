<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RETROVAULT - レトロゲーム コレクション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #f1f5f9;
      overflow-x: hidden;
    }
    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }
    .game-card-hover {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .game-card-hover:active {
      transform: scale(0.98);
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col w-full max-w-[100vw] overflow-x-hidden">

  <!-- ================= ヘッダー ================= -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md border-b-2 border-emerald-500 w-full">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
      
      <!-- ロゴ / タイトル -->
      <div class="flex items-center gap-2 cursor-pointer min-w-0" onclick="switchNav('catalog')">
        <div class="w-8 h-8 rounded bg-emerald-600 flex items-center justify-center p-1 shadow shrink-0">
          <svg viewBox="0 0 24 24" class="w-full h-full fill-white" shape-rendering="crispEdges">
            <rect x="9" y="3" width="6" height="6"></rect>
            <rect x="9" y="15" width="6" height="6"></rect>
            <rect x="3" y="9" width="6" height="6"></rect>
            <rect x="15" y="9" width="6" height="6"></rect>
            <rect x="9" y="9" width="6" height="6"></rect>
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-base sm:text-lg font-black tracking-wider text-emerald-400 pixel-font leading-none truncate">RETROVAULT</h1>
          <p class="text-[10px] text-slate-400 truncate">レトロゲームを集めよう！</p>
        </div>
      </div>

      <!-- ユーザー認証 / ツールバー -->
      <div class="flex items-center gap-1.5 shrink-0">
        <!-- 同期ステータス -->
        <span id="syncStatus" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 sm:flex items-center gap-1 border border-slate-700">
          <i data-lucide="cloud" class="w-3 h-3 text-emerald-400"></i><span id="syncText">同期中</span>
        </span>

        <!-- Google 認証ボタンエリア -->
        <div id="authContainer" class="flex items-center">
          <button id="btnLogin" onclick="loginWithGoogle()" class="flex items-center gap-1 px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-bold transition shadow">
            <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Google</span>ログイン
          </button>
          <div id="userInfo" class="hidden items-center gap-1.5">
            <img id="userAvatar" src="" class="w-7 h-7 rounded-full border border-emerald-400 object-cover" alt="User">
            <button onclick="logoutFromGoogle()" title="ログアウト" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 transition">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

        <!-- バックアップ（手動） -->
        <button onclick="exportData()" title="エクスポート" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 transition">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <label title="インポート" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 transition cursor-pointer mb-0">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
        </label>
      </div>
    </div>

    <!-- ナビゲーションバー -->
    <nav class="bg-slate-950 px-2 py-1 flex items-center justify-around border-t border-slate-800 text-xs">
      <button onclick="switchNav('catalog')" id="nav-catalog" class="nav-btn flex items-center gap-1 px-2.5 py-1 rounded font-bold text-emerald-400 bg-slate-800">
        <i data-lucide="gamepad-2" class="w-3.5 h-3.5"></i><span>図鑑</span>
      </button>
      <button onclick="openProgressModal()" id="nav-progress" class="nav-btn flex items-center gap-1 px-2.5 py-1 rounded font-bold text-slate-400 hover:text-white">
        <i data-lucide="trophy" class="w-3.5 h-3.5"></i><span>達成率</span>
      </button>
      <button onclick="switchNav('log')" id="nav-log" class="nav-btn flex items-center gap-1 px-2.5 py-1 rounded font-bold text-slate-400 hover:text-white">
        <i data-lucide="message-square" class="w-3.5 h-3.5"></i><span>記録</span>
      </button>
      <button onclick="switchNav('news')" id="nav-news" class="nav-btn flex items-center gap-1 px-2.5 py-1 rounded font-bold text-slate-400 hover:text-white">
        <i data-lucide="newspaper" class="w-3.5 h-3.5"></i><span>ニュース</span>
      </button>
    </nav>
  </header>

  <!-- ================= メインコンテナ ================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4">

    <!-- 1. 図鑑セクション -->
    <section id="sectionCatalog" class="space-y-2">
      
      <!-- ★ 検索窓（最上部に配置） -->
      <div class="bg-white p-2.5 rounded-lg shadow-sm border border-slate-200">
        <div class="relative flex items-center">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none"></i>
          <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="ゲーム名、メーカー名で素早く検索..." class="w-full pl-9 pr-8 py-2 bg-slate-50 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          <button id="searchClearBtn" onclick="clearSearch()" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 p-0.5">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 統計サマリーカウンター -->
      <div class="bg-slate-900 text-white p-2.5 rounded-lg shadow-sm flex items-center justify-between text-xs px-3">
        <div class="flex items-center gap-2">
          <span>全 <strong id="countTotal" class="text-slate-200">0</strong> 本</span>
          <span class="text-slate-500">|</span>
          <span>所持 <strong id="countOwned" class="text-emerald-400">0</strong> 本</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-slate-400">達成率:</span>
          <span id="rateTotal" class="font-bold text-emerald-400 text-sm">0.0%</span>
        </div>
      </div>

      <!-- フィルター開閉トグル（スマホ向けコンパクト化） -->
      <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
        <button onclick="toggleFilterAccordion()" class="w-full px-3 py-2 text-xs font-bold text-slate-700 bg-slate-50 flex items-center justify-between border-b border-slate-200 hover:bg-slate-100 transition">
          <span class="flex items-center gap-1.5"><i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-emerald-600"></i> 絞り込みフィルター</span>
          <span id="filterToggleIcon" class="text-slate-400 text-[10px]">開く ▼</span>
        </button>

        <div id="filterContent" class="hidden p-3 space-y-3">
          <!-- 所持状態 -->
          <div>
            <div class="text-[11px] font-bold text-slate-500 mb-1">ステータス</div>
            <div class="flex flex-wrap gap-1.5 text-xs">
              <button onclick="setCollectFilter('all')" class="filter-status-btn px-2.5 py-1 rounded border border-slate-300 font-bold bg-emerald-600 text-white" data-filter="all">全件</button>
              <button onclick="setCollectFilter('owned')" class="filter-status-btn px-2.5 py-1 rounded border border-slate-300 font-bold bg-white text-slate-700" data-filter="owned">所持のみ</button>
              <button onclick="setCollectFilter('wish')" class="filter-status-btn px-2.5 py-1 rounded border border-slate-300 font-bold bg-white text-slate-700" data-filter="wish">ほしい</button>
              <button onclick="setCollectFilter('playing')" class="filter-status-btn px-2.5 py-1 rounded border border-slate-300 font-bold bg-white text-slate-700" data-filter="playing">プレイ中</button>
              <button onclick="setCollectFilter('cleared')" class="filter-status-btn px-2.5 py-1 rounded border border-slate-300 font-bold bg-white text-slate-700" data-filter="cleared">クリア済</button>
            </div>
          </div>

          <!-- ハードウェア -->
          <div>
            <div class="text-[11px] font-bold text-slate-500 mb-1">ハード</div>
            <div id="platformFilterContainer" class="flex flex-wrap gap-1 text-[11px]"></div>
          </div>

          <!-- 五十音インデックス -->
          <div>
            <div class="text-[11px] font-bold text-slate-500 mb-1">五十音</div>
            <div id="syllabaryContainer" class="flex flex-wrap gap-1 text-[11px]"></div>
          </div>
        </div>
      </div>

      <!-- ゲームカード一覧グリッド -->
      <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 pt-1">
        <!-- JSで動的生成 -->
      </div>

      <!-- ページング / もっと見る -->
      <div id="loadMoreContainer" class="py-4 text-center hidden">
        <button onclick="loadMoreGames()" class="px-6 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold text-xs rounded-full shadow-sm transition">
          さらに表示する
        </button>
      </div>
    </section>

    <!-- 2. プレイログ セクション -->
    <section id="sectionLog" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-800 mb-2 flex items-center gap-1.5">
          <i data-lucide="edit-3" class="w-4 h-4 text-emerald-600"></i>プレイの記録をつぶやく
        </h2>
        <input type="text" id="logGameTitle" placeholder="ゲーム名（任意）" class="w-full p-2 mb-2 bg-slate-50 border border-slate-300 rounded text-xs focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
        <textarea id="logContent" rows="3" placeholder="感想、苦戦したボス、クリアした思い出..." class="w-full p-2 bg-slate-50 border border-slate-300 rounded text-xs focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500"></textarea>
        <div class="flex justify-end mt-2">
          <button onclick="submitPlayLog()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-bold shadow">
            記録を投稿
          </button>
        </div>
      </div>
      <div id="playLogsList" class="space-y-2"></div>
    </section>

    <!-- 3. レトロゲームニュース セクション -->
    <section id="sectionNews" class="hidden space-y-2">
      <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-slate-200 text-xs">
        <span class="font-bold text-slate-700 flex items-center gap-1"><i data-lucide="rss" class="w-3.5 h-3.5 text-orange-500"></i> 業界最新トピックス</span>
        <button onclick="fetchRetroNews(true)" class="text-emerald-600 hover:text-emerald-700 font-bold flex items-center gap-0.5">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i> 更新
        </button>
      </div>
      <div id="newsListContainer" class="space-y-2"></div>
    </section>

  </main>

  <!-- ================= 達成率モーダル ================= -->
  <div id="progressModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full max-h-[85vh] flex flex-col overflow-hidden">
      <div class="bg-slate-900 text-white p-3 flex items-center justify-between border-b border-emerald-500">
        <div class="flex items-center gap-2">
          <button id="progressBackBtn" onclick="backProgressCategory()" class="hidden p-1 hover:bg-slate-800 rounded">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
          </button>
          <h3 id="progressModalTitle" class="text-sm font-bold flex items-center gap-1.5">
            <i data-lucide="trophy" class="w-4 h-4 text-emerald-400"></i> コレクション進捗
          </h3>
        </div>
        <button onclick="closeProgressModal()" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="progressModalBody" class="p-3 overflow-y-auto flex-1 space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- ================= ゲーム詳細 / 編集モーダル ================= -->
  <div id="gameDetailModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full max-h-[90vh] flex flex-col overflow-hidden">
      <div class="bg-slate-900 text-white p-3 flex items-center justify-between border-b border-emerald-500">
        <h3 id="detailGameTitle" class="text-sm font-bold truncate pr-2">ゲームタイトル</h3>
        <button onclick="closeDetailModal()" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="p-3 overflow-y-auto flex-1 space-y-3 text-xs">
        <div class="flex gap-3">
          <div id="detailCoverContainer" class="w-24 h-24 bg-slate-100 rounded border border-slate-200 flex items-center justify-center shrink-0 overflow-hidden"></div>
          <div class="flex-1 space-y-1">
            <div><span class="text-slate-400">ハード:</span> <span id="detailPlatform" class="font-bold text-slate-700"></span></div>
            <div><span class="text-slate-400">メーカー:</span> <span id="detailMaker" class="font-bold text-slate-700"></span></div>
            <div><span class="text-slate-400">ジャンル:</span> <span id="detailGenre" class="font-bold text-slate-700"></span></div>
            <div><span class="text-slate-400">発売日:</span> <span id="detailRelease" class="font-bold text-slate-700"></span></div>
          </div>
        </div>

        <!-- 状態切り替えボタン -->
        <div>
          <label class="font-bold text-slate-600 block mb-1">所持ステータス</label>
          <div class="grid grid-cols-4 gap-1">
            <button onclick="setDetailStatus('owned')" id="statusBtn_owned" class="py-1.5 rounded font-bold border border-slate-300">所持</button>
            <button onclick="setDetailStatus('wish')" id="statusBtn_wish" class="py-1.5 rounded font-bold border border-slate-300">ほしい</button>
            <button onclick="setDetailStatus('playing')" id="statusBtn_playing" class="py-1.5 rounded font-bold border border-slate-300">プレイ中</button>
            <button onclick="setDetailStatus('cleared')" id="statusBtn_cleared" class="py-1.5 rounded font-bold border border-slate-300">クリア</button>
          </div>
        </div>

        <div>
          <label class="font-bold text-slate-600 block mb-1">おすすめ評価 (1〜5)</label>
          <div id="detailRatingStars" class="flex gap-1 text-slate-300 cursor-pointer"></div>
        </div>

        <div>
          <label class="font-bold text-slate-600 block mb-1">メモ</label>
          <textarea id="detailMemo" rows="2" class="w-full p-2 bg-slate-50 border border-slate-300 rounded focus:bg-white focus:outline-none" placeholder="購入価格、状態、攻略メモ..."></textarea>
        </div>
      </div>
      <div class="bg-slate-50 p-2.5 border-t border-slate-200 flex justify-end gap-2">
        <button onclick="closeDetailModal()" class="px-3 py-1.5 border border-slate-300 rounded font-bold text-slate-600 hover:bg-slate-100">閉じる</button>
        <button onclick="saveDetailState()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold shadow">保存する</button>
      </div>
    </div>
  </div>

  <!-- ================= JavaScript 実装 ================= -->
  <script>
    // --- 1. Firebase 初期化設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBs_9uxZDVTOQ-bS4l5Qmbe4jBzGqKAMqc",
      authDomain: "retrogame-collection.firebaseapp.com",
      projectId: "retrogame-collection",
      storageBucket: "retrogame-collection.firebasestorage.app",
      messagingSenderId: "693227231373",
      appId: "1:693227231373:web:6466ddff52a7027005eac4",
      measurementId: "G-NQXNV1X7DD"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let firestoreUnsubscribe = null;

    // --- 2. アプリケーション共通ステート ---
    const MASTER_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQg9s-n-9QZ31MfqJb0f-8cE6_bH2s6q-Lw-jX-H0w-4K2i0FmQ4t-hZ/pub?gid=0&single=true&output=csv';
    
    let masterList = [];       // 全タイトルマスター
    let userStates = {};       // ユーザー状態 { [title]: { status, rating, memo, ... } }
    let playPosts = [];        // プレイログ
    let filteredGames = [];    // 現在の検索・絞り込み結果
    let currentCollectFilter = 'all'; // 初期表示は全タイトル
    let currentPlatformFilter = 'ALL';
    let currentSyllabaryFilter = 'ALL';
    let searchQuery = '';
    let displayLimit = 60;     // 初回表示件数
    let activeDetailGame = null;

    // --- 3. 認証制御 (Googleログイン/ログアウト) ---
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => {
        console.error("ログインエラー:", err);
        alert("Googleログインに失敗しました: " + err.message);
      });
    }

    function logoutFromGoogle() {
      auth.signOut().then(() => {
        if (firestoreUnsubscribe) firestoreUnsubscribe();
        currentUser = null;
        updateAuthUI(null);
        // ローカルデータへ切り替え
        loadFromLocalStorage();
        applyFilterAndRender();
      });
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      updateAuthUI(user);
      if (user) {
        // クラウド同期リスナー開始
        bindFirestoreUser(user.uid);
      } else {
        loadFromLocalStorage();
        applyFilterAndRender();
      }
    });

    function updateAuthUI(user) {
      const btnLogin = document.getElementById('btnLogin');
      const userInfo = document.getElementById('userInfo');
      const userAvatar = document.getElementById('userAvatar');
      const syncStatus = document.getElementById('syncStatus');

      if (user) {
        btnLogin.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userInfo.classList.add('flex');
        userAvatar.src = user.photoURL || '';
        syncStatus.classList.remove('hidden');
        document.getElementById('syncText').textContent = 'クラウド同期中';
      } else {
        btnLogin.classList.remove('hidden');
        userInfo.classList.add('hidden');
        userAvatar.src = '';
        syncStatus.classList.add('hidden');
      }
    }

    // --- 4. Firestore リアルタイム同期 ---
    function bindFirestoreUser(uid) {
      if (firestoreUnsubscribe) firestoreUnsubscribe();

      firestoreUnsubscribe = db.collection('users').doc(uid).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          userStates = data.userStates || {};
          playPosts = data.playPosts || [];
          saveToLocalStorage(); // ローカルにもキャッシュ
          applyFilterAndRender();
          renderPlayLogs();
          document.getElementById('syncText').textContent = '同期完了';
        } else {
          // 新規ドキュメント作成
          syncToFirestore();
        }
      }, err => {
        console.error("Firestoreリアルタイム同期エラー:", err);
      });
    }

    let syncTimer = null;
    function syncToFirestore() {
      saveToLocalStorage();
      if (!currentUser) return;

      document.getElementById('syncText').textContent = '保存中...';
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        db.collection('users').doc(currentUser.uid).set({
          userStates: userStates,
          playPosts: playPosts,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).then(() => {
          document.getElementById('syncText').textContent = '同期完了';
        }).catch(err => {
          console.error("Firestore保存エラー:", err);
          document.getElementById('syncText').textContent = '保存失敗';
        });
      }, 500);
    }

    // --- 5. ローカルストレージ制御 ---
    function saveToLocalStorage() {
      localStorage.setItem('retro_user_states', JSON.stringify(userStates));
      localStorage.setItem('retro_play_posts', JSON.stringify(playPosts));
    }

    function loadFromLocalStorage() {
      try {
        userStates = JSON.parse(localStorage.getItem('retro_user_states') || '{}');
        playPosts = JSON.parse(localStorage.getItem('retro_play_posts') || '[]');
      } catch (e) {
        userStates = {};
        playPosts = [];
      }
    }

    // --- 6. マスターデータの読み込み ---
    async function loadMasterCatalog() {
      // キャッシュ確認
      const cached = localStorage.getItem('retro_master_cache');
      if (cached) {
        try {
          masterList = JSON.parse(cached);
          setupFilterButtons();
          applyFilterAndRender();
        } catch (e) {}
      }

      // スプレッドシートから最新CSVをバックグラウンド取得
      try {
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(MASTER_CSV_URL);
        const res = await fetch(proxyUrl);
        if (res.ok) {
          const csvText = await res.text();
          parseMasterCsv(csvText);
        }
      } catch (e) {
        console.warn("マスターデータ更新スキップ (オフライン/制限)");
      }
    }

    function parseMasterCsv(csvText) {
      const lines = csvText.split(/\r\n|\n/);
      if (lines.length < 2) return;

      const games = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cols = parseCsvLine(line);
        if (cols.length >= 2 && cols[1]) {
          games.push({
            id: cols[0] || ('G_' + i),
            title: cols[1].trim(),
            platform: cols[2] ? cols[2].trim() : 'FC',
            maker: cols[3] ? cols[3].trim() : '',
            genre: cols[4] ? cols[4].trim() : '',
            release_date: cols[5] ? cols[5].trim() : '',
            cover_url: cols[6] ? cols[6].trim() : ''
          });
        }
      }

      if (games.length > 0) {
        masterList = games;
        localStorage.setItem('retro_master_cache', JSON.stringify(masterList));
        setupFilterButtons();
        applyFilterAndRender();
      }
    }

    function parseCsvLine(text) {
      const p = [];
      let cur = '', inQuote = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuote = !inQuote;
        } else if (c === ',' && !inQuote) {
          p.push(cur.trim());
          cur = '';
        } else {
          cur += c;
        }
      }
      p.push(cur.trim());
      return p;
    }

    // --- 7. 検索・絞り込みロジック ---
    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      document.getElementById('searchClearBtn').classList.toggle('hidden', !searchQuery);
      displayLimit = 60;
      applyFilterAndRender();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('searchClearBtn').classList.add('hidden');
      displayLimit = 60;
      applyFilterAndRender();
    }

    function setCollectFilter(filter) {
      currentCollectFilter = filter;
      document.querySelectorAll('.filter-status-btn').forEach(btn => {
        const active = btn.getAttribute('data-filter') === filter;
        btn.className = `filter-status-btn px-2.5 py-1 rounded border font-bold text-xs ${active ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-300'}`;
      });
      displayLimit = 60;
      applyFilterAndRender();
    }

    function setPlatformFilter(plat) {
      currentPlatformFilter = plat;
      setupFilterButtons();
      displayLimit = 60;
      applyFilterAndRender();
    }

    function setSyllabaryFilter(syl) {
      currentSyllabaryFilter = syl;
      setupFilterButtons();
      displayLimit = 60;
      applyFilterAndRender();
    }

    function applyFilterAndRender() {
      let ownedCount = 0;
      const totalCount = masterList.length;

      // 収集数カウント
      masterList.forEach(g => {
        const st = userStates[g.title]?.status;
        if (st === 'owned' || st === 'cleared') ownedCount++;
      });

      document.getElementById('countTotal').textContent = totalCount;
      document.getElementById('countOwned').textContent = ownedCount;
      document.getElementById('rateTotal').textContent = totalCount > 0 ? ((ownedCount / totalCount) * 100).toFixed(1) + '%' : '0.0%';

      // 絞り込み実行
      filteredGames = masterList.filter(g => {
        const st = userStates[g.title]?.status || 'none';

        // 状態フィルター
        if (currentCollectFilter === 'owned' && st !== 'owned' && st !== 'cleared') return false;
        if (currentCollectFilter === 'wish' && st !== 'wish') return false;
        if (currentCollectFilter === 'playing' && st !== 'playing') return false;
        if (currentCollectFilter === 'cleared' && st !== 'cleared') return false;

        // ハードフィルター
        if (currentPlatformFilter !== 'ALL' && g.platform !== currentPlatformFilter) return false;

        // 五十音フィルター
        if (currentSyllabaryFilter !== 'ALL') {
          const firstChar = g.title.charAt(0);
          if (!matchSyllabary(firstChar, currentSyllabaryFilter)) return false;
        }

        // 検索クエリ
        if (searchQuery) {
          const matchTitle = g.title.toLowerCase().includes(searchQuery);
          const matchMaker = g.maker.toLowerCase().includes(searchQuery);
          if (!matchTitle && !matchMaker) return false;
        }

        return true;
      });

      renderGameGrid();
    }

    function renderGameGrid() {
      const container = document.getElementById('gameGrid');
      const itemsToRender = filteredGames.slice(0, displayLimit);

      if (itemsToRender.length === 0) {
        container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-xs">該当するタイトルが見つかりませんでした</div>';
        document.getElementById('loadMoreContainer').classList.add('hidden');
        return;
      }

      container.innerHTML = itemsToRender.map(g => {
        const state = userStates[g.title] || {};
        const isOwned = state.status === 'owned' || state.status === 'cleared';
        const coverHtml = g.cover_url 
          ? `<img src="${g.cover_url}" class="w-full h-full object-cover" loading="lazy" alt="${g.title}" onerror="this.outerHTML=getDefaultSvg('${g.platform}')">`
          : getDefaultSvg(g.platform);

        const badgeBg = isOwned ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600';
        const badgeText = isOwned ? (state.status === 'cleared' ? 'クリア' : '所持') : '未所持';

        return `
          <div class="bg-white rounded-lg border border-slate-200 p-2 flex flex-col justify-between game-card-hover shadow-sm cursor-pointer" onclick="openDetailModal('${escapeHtml(g.title)}')">
            <div>
              <div class="aspect-square bg-slate-100 rounded overflow-hidden relative flex items-center justify-center border border-slate-100">
                ${coverHtml}
                <span class="absolute top-1 right-1 text-[9px] font-bold px-1.5 py-0.5 rounded shadow ${badgeBg}">
                  ${badgeText}
                </span>
              </div>
              <h4 class="font-bold text-xs text-slate-800 mt-2 line-clamp-2 leading-tight" title="${g.title}">${g.title}</h4>
            </div>
            <div class="mt-2 pt-1 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-500">
              <span class="bg-slate-100 px-1.5 py-0.5 rounded font-mono font-bold text-slate-600">${g.platform}</span>
              <span class="truncate max-w-[80px]">${g.maker || ''}</span>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('loadMoreContainer').classList.toggle('hidden', filteredGames.length <= displayLimit);
      lucide.createIcons();
    }

    function loadMoreGames() {
      displayLimit += 60;
      renderGameGrid();
    }

    function getDefaultSvg(plat) {
      return `<div class="w-full h-full flex flex-col items-center justify-center bg-slate-800 text-slate-400 p-2"><i data-lucide="disc" class="w-8 h-8 text-slate-600 mb-1"></i><span class="text-[10px] font-mono font-bold text-emerald-400">${plat || 'GAME'}</span></div>`;
    }

    // --- 8. 詳細・登録モーダル ---
    function openDetailModal(title) {
      const game = masterList.find(g => g.title === title);
      if (!game) return;

      activeDetailGame = game;
      const state = userStates[title] || { status: 'none', rating: 0, memo: '' };

      document.getElementById('detailGameTitle').textContent = game.title;
      document.getElementById('detailPlatform').textContent = game.platform;
      document.getElementById('detailMaker').textContent = game.maker || '不明';
      document.getElementById('detailGenre').textContent = game.genre || '不明';
      document.getElementById('detailRelease').textContent = game.release_date || '不明';
      document.getElementById('detailMemo').value = state.memo || '';

      const coverContainer = document.getElementById('detailCoverContainer');
      coverContainer.innerHTML = game.cover_url 
        ? `<img src="${game.cover_url}" class="w-full h-full object-cover" onerror="this.outerHTML=getDefaultSvg('${game.platform}')">`
        : getDefaultSvg(game.platform);

      updateDetailStatusButtons(state.status || 'none');
      updateRatingStars(state.rating || 0);

      document.getElementById('gameDetailModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeDetailModal() {
      document.getElementById('gameDetailModal').classList.add('hidden');
      activeDetailGame = null;
    }

    function setDetailStatus(status) {
      const current = userStates[activeDetailGame.title]?.status;
      const nextStatus = current === status ? 'none' : status;
      updateDetailStatusButtons(nextStatus);
    }

    function updateDetailStatusButtons(selected) {
      ['owned', 'wish', 'playing', 'cleared'].forEach(st => {
        const btn = document.getElementById('statusBtn_' + st);
        const isActive = selected === st;
        btn.className = `py-1.5 rounded font-bold border text-xs transition ${
          isActive 
            ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
        }`;
      });
      if (activeDetailGame) {
        if (!userStates[activeDetailGame.title]) userStates[activeDetailGame.title] = {};
        userStates[activeDetailGame.title].status = selected;
      }
    }

    function updateRatingStars(rating) {
      const container = document.getElementById('detailRatingStars');
      container.innerHTML = [1, 2, 3, 4, 5].map(i => `
        <span onclick="setRating(${i})" class="text-lg ${i <= rating ? 'text-amber-400' : 'text-slate-200'}">★</span>
      `).join('');
    }

    function setRating(val) {
      if (!activeDetailGame) return;
      if (!userStates[activeDetailGame.title]) userStates[activeDetailGame.title] = {};
      userStates[activeDetailGame.title].rating = val;
      updateRatingStars(val);
    }

    function saveDetailState() {
      if (!activeDetailGame) return;
      const memo = document.getElementById('detailMemo').value;
      if (!userStates[activeDetailGame.title]) userStates[activeDetailGame.title] = {};
      userStates[activeDetailGame.title].memo = memo;

      closeDetailModal();
      syncToFirestore();
      applyFilterAndRender();
    }

    // --- 9. 達成率モーダル ---
    let progressCategory = null;

    function openProgressModal() {
      progressCategory = null;
      renderProgressCategories();
      document.getElementById('progressModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeProgressModal() {
      document.getElementById('progressModal').classList.add('hidden');
    }

    function renderProgressCategories() {
      document.getElementById('progressBackBtn').classList.add('hidden');
      document.getElementById('progressModalTitle').innerHTML = '<i data-lucide="trophy" class="w-4 h-4 text-emerald-400"></i> コレクション進捗';

      const platforms = {};
      masterList.forEach(g => {
        platforms[g.platform] = (platforms[g.platform] || 0) + 1;
      });

      const body = document.getElementById('progressModalBody');
      body.innerHTML = `
        <div class="text-xs font-bold text-slate-600 mb-2">ハード別制覇状況</div>
        <div class="space-y-1.5">
          ${Object.keys(platforms).sort().map(p => {
            const total = platforms[p];
            const owned = masterList.filter(g => g.platform === p && (userStates[g.title]?.status === 'owned' || userStates[g.title]?.status === 'cleared')).length;
            const rate = ((owned / total) * 100).toFixed(1);
            return `
              <div onclick="showProgressDetail('${p}')" class="p-2.5 bg-slate-50 hover:bg-emerald-50 rounded-lg border border-slate-200 cursor-pointer flex items-center justify-between transition">
                <div class="flex items-center gap-2">
                  <span class="font-mono font-bold text-xs bg-slate-800 text-white px-2 py-0.5 rounded">${p}</span>
                  <span class="text-slate-600">${owned} /${total} 本</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-emerald-600">${rate}%</span>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      lucide.createIcons();
    }

    function showProgressDetail(plat) {
      progressCategory = plat;
      document.getElementById('progressBackBtn').classList.remove('hidden');
      document.getElementById('progressModalTitle').textContent = `${plat} の未所持タイトル`;

      const unowned = masterList.filter(g => g.platform === plat && (!userStates[g.title] || (userStates[g.title].status !== 'owned' && userStates[g.title].status !== 'cleared')));

      const body = document.getElementById('progressModalBody');
      body.innerHTML = `
        <div class="text-[11px] text-slate-500 mb-2">あと ${unowned.length} 本でコンプリート</div>
        <div class="divide-y divide-slate-100 max-h-96 overflow-y-auto">
          ${unowned.map(g => `
            <div class="py-2 flex items-center justify-between text-xs">
              <span class="font-medium text-slate-800 truncate pr-2">${g.title}</span>
              <button onclick="quickOwn('${escapeHtml(g.title)}')" class="shrink-0 px-2 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white rounded border border-emerald-300 font-bold text-[10px] transition">
                所持にする
              </button>
            </div>
          `).join('')}
        </div>
      `;
      lucide.createIcons();
    }

    function backProgressCategory() {
      renderProgressCategories();
    }

    function quickOwn(title) {
      if (!userStates[title]) userStates[title] = {};
      userStates[title].status = 'owned';
      syncToFirestore();
      applyFilterAndRender();
      if (progressCategory) showProgressDetail(progressCategory);
    }

    // --- 10. プレイログ機能 ---
    function submitPlayLog() {
      const title = document.getElementById('logGameTitle').value.trim();
      const content = document.getElementById('logContent').value.trim();
      if (!content) return alert("ログ内容を入力してください");

      playPosts.unshift({
        id: 'L_' + Date.now(),
        gameTitle: title,
        content: content,
        createdAt: new Date().toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      });

      document.getElementById('logGameTitle').value = '';
      document.getElementById('logContent').value = '';
      syncToFirestore();
      renderPlayLogs();
    }

    function renderPlayLogs() {
      const container = document.getElementById('playLogsList');
      if (playPosts.length === 0) {
        container.innerHTML = '<div class="py-8 text-center text-slate-400 text-xs">まだ記録がありません。最初の思い出をつぶやいてみましょう。</div>';
        return;
      }
      container.innerHTML = playPosts.map(p => `
        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm space-y-1 text-xs">
          <div class="flex items-center justify-between text-slate-400 text-[10px]">
            <span class="font-bold text-emerald-600 text-xs">${p.gameTitle || 'レトロゲーム'}</span>
            <span>${p.createdAt}</span>
          </div>
          <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(p.content)}</p>
        </div>
      `).join('');
    }

    // --- 11. レトロニュース (sessionStorage キャッシュ付き) ---
    async function fetchRetroNews(forceRefresh = false) {
      const container = document.getElementById('newsListContainer');
      const cached = sessionStorage.getItem('retro_news_cache');
      const cachedTime = sessionStorage.getItem('retro_news_time');

      if (!forceRefresh && cached && cachedTime && (Date.now() - cachedTime < 1800000)) {
        renderNews(JSON.parse(cached));
        return;
      }

      container.innerHTML = '<div class="py-8 text-center text-slate-400 text-xs">最新ニュースを読み込み中...</div>';

      try {
        const feedUrl = 'https://news.denfaminicogamer.jp/feed';
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`);
        const data = await res.json();

        if (data.status === 'ok' && data.items) {
          sessionStorage.setItem('retro_news_cache', JSON.stringify(data.items));
          sessionStorage.setItem('retro_news_time', Date.now());
          renderNews(data.items);
        } else {
          container.innerHTML = '<div class="py-6 text-center text-slate-400 text-xs">ニュース取得に失敗しました</div>';
        }
      } catch (e) {
        container.innerHTML = '<div class="py-6 text-center text-slate-400 text-xs">ニュースの読み込み中にエラーが発生しました</div>';
      }
    }

    function renderNews(items) {
      const container = document.getElementById('newsListContainer');
      container.innerHTML = items.slice(0, 15).map(item => `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="block bg-white p-3 rounded-lg border border-slate-200 hover:border-emerald-500 shadow-sm transition space-y-1">
          <h4 class="font-bold text-xs text-slate-800 leading-snug line-clamp-2">${item.title}</h4>
          <div class="flex items-center justify-between text-[10px] text-slate-400">
            <span>電ファミニコゲーマー</span>
            <span>${item.pubDate ? item.pubDate.substring(0, 16) : ''}</span>
          </div>
        </a>
      `).join('');
    }

    // --- 12. 補助UI・ユーティリティ ---
    function toggleFilterAccordion() {
      const content = document.getElementById('filterContent');
      const icon = document.getElementById('filterToggleIcon');
      const isHidden = content.classList.contains('hidden');
      content.classList.toggle('hidden', !isHidden);
      icon.textContent = isHidden ? '閉じる ▲' : '開く ▼';
    }

    function switchNav(tab) {
      ['catalog', 'log', 'news'].forEach(t => {
        const sec = document.getElementById('section' + t.charAt(0).toUpperCase() + t.slice(1));
        const btn = document.getElementById('nav-' + t);
        if (sec) sec.classList.toggle('hidden', t !== tab);
        if (btn) {
          btn.className = `nav-btn flex items-center gap-1 px-2.5 py-1 rounded font-bold text-xs ${t === tab ? 'text-emerald-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`;
        }
      });
      if (tab === 'log') renderPlayLogs();
      if (tab === 'news') fetchRetroNews();
    }

    function setupFilterButtons() {
      // ハードウェア
      const pContainer = document.getElementById('platformFilterContainer');
      const platforms = ['ALL', ...new Set(masterList.map(g => g.platform))].filter(Boolean);
      pContainer.innerHTML = platforms.map(p => `
        <button onclick="setPlatformFilter('${p}')" class="px-2 py-0.5 rounded border ${currentPlatformFilter === p ? 'bg-slate-800 text-white border-slate-800 font-bold' : 'bg-slate-50 text-slate-600 border-slate-200'}">${p}</button>
      `).join('');

      // 五十音
      const sContainer = document.getElementById('syllabaryContainer');
      const rows = ['ALL', 'ア', 'カ', 'サ', 'タ', 'ナ', 'ハ', 'マ', 'ヤ', 'ラ', 'ワ', 'A-Z'];
      sContainer.innerHTML = rows.map(r => `
        <button onclick="setSyllabaryFilter('${r}')" class="px-2 py-0.5 rounded border ${currentSyllabaryFilter === r ? 'bg-slate-800 text-white border-slate-800 font-bold' : 'bg-slate-50 text-slate-600 border-slate-200'}">${r}</button>
      `).join('');
    }

    function matchSyllabary(char, row) {
      if (row === 'A-Z') return /^[a-zA-Z0-9]/.test(char);
      const map = {
        'ア': /^[あいうえおアイウエオ]/,
        'カ': /^[かきくけこがぎぐげごカキクケコガギグゲゴ]/,
        'サ': /^[さしすせそざじずぜぞサシスセソザジズゼゾ]/,
        'タ': /^[たちつてとだぢづでどタチツテトダヂヅデド]/,
        'ナ': /^[なにぬねのナニヌネノ]/,
        'ハ': /^[はひふへほばびぶべぼぱぴぷぺぽハヒフヘホバビブベボパピプペポ]/,
        'マ': /^[まみむめもマミムメモ]/,
        'ヤ': /^[やゆよヤユヨ]/,
        'ラ': /^[らりるれろラリルレロ]/,
        'ワ': /^[わをんワヲン]/
      };
      return map[row] ? map[row].test(char) : false;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    function exportData() {
      const data = { userStates, playPosts, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `retrovault_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const json = JSON.parse(e.target.result);
          if (json.userStates) userStates = json.userStates;
          if (json.playPosts) playPosts = json.playPosts;
          syncToFirestore();
          applyFilterAndRender();
          alert("バックアップを正常に復元しました。");
        } catch (err) {
          alert("ファイル形式が正しくありません。");
        }
      };
      reader.readAsText(file);
    }

    // --- 起動シーケンス ---
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadFromLocalStorage();
      loadMasterCatalog();
    });
  </script>
</body>
